[/Script/RemoteControlCommon.RemoteControlSettings]
bAutoStartWebServer=True
RemoteControlHttpServerPort=30010
bRestrictServerAccess=True
bEnforcePassphraseForRemoteClients=True

; 最小权限：不开 bAllowAnyRemoteFunctionCall，只白名单 PythonScriptLibrary 一个类。
; bEnableRemotePythonExecution 是必须的 —— RemoteControlModule.cpp 的 CanBeAccessedRemotely()
; 会在它为 False 时把 PythonScriptLibrary 整个类从远程访问中屏蔽掉。
; 开启后等于允许任意 Python 在编辑器内执行，因此上面用 bRestrictServerAccess 把入口锁死在本机：
; 127.0.0.1 免口令直通，非本机客户端没有口令一律拒绝。
bEnableRemotePythonExecution=True
bAllowAnyRemoteFunctionCall=False
bAllowConsoleCommandRemoteExecution=False
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/PythonScriptPlugin.PythonScriptLibrary")
